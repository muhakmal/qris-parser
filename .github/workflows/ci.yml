name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Style Gate 🔍
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linter
        run: pip install ruff

      - name: Run Ruff check
        run: ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }}) 🧪
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest

      - name: Run test suite with pytest
        run: |
          pytest -v

      - name: Run zero-dependency standalone runner
        run: |
          python tests/runner.py

      - name: Test CLI executable
        run: |
          qris-parser --version
          qris-parser "00020101021126570011ID.DANA.WWW011893600009150000000002090000000010303UMI51440014ID.CO.QRIS.WWW0215ID10200000000010303UMI5204581253033605802ID5909TEST SHOP6007JAKARTA61051234062070703A0163048827" --validate
          qris-parser "00020101021126570011ID.DANA.WWW011893600009150000000002090000000010303UMI51440014ID.CO.QRIS.WWW0215ID10200000000010303UMI5204581253033605802ID5909TEST SHOP6007JAKARTA61051234062070703A0163048827" --json
