[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qris-parser"
version = "0.2.0"
description = "Production-grade Python parser, compliance validator, and dynamic generator for QRIS (ASPI v1.0, EMVCo MPM & CPM)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Akmal", email = "muhakmal@users.noreply.github.com" }
]
keywords = [
    "qris",
    "aspi",
    "emvco",
    "payment",
    "indonesia",
    "fintech",
    "tlv",
    "crc16",
    "cpm",
    "mpm"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]
dependencies = [
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
image = [
    "qrcode[pil]>=7.0",
]
all = [
    "qrcode[pil]>=7.0",
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
qris-parser = "qris_parser.cli:main"

[project.urls]
Homepage = "https://github.com/muhakmal/qris-parser"
Documentation = "https://github.com/muhakmal/qris-parser#readme"
Repository = "https://github.com/muhakmal/qris-parser.git"
Issues = "https://github.com/muhakmal/qris-parser/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["qris_parser*"]

[tool.setuptools.package-data]
"qris_parser.data" = ["*.csv"]
"qris_parser" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
